<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">设计判断框架开发示例</title>
  <desc id="desc">目标、限制与取舍三个要素形成设计判断</desc>
  <rect width="1440" height="900" fill="#e9e9e3"/>
  <g fill="none" stroke="#6a6862" stroke-width="2">
    <circle cx="460" cy="430" r="220"/><circle cx="720" cy="430" r="220"/><circle cx="590" cy="630" r="220"/>
  </g>
  <g fill="#191915" font-family="Arial, PingFang SC, sans-serif" text-anchor="middle">
    <text x="390" y="365" font-size="42">目标</text><text x="790" y="365" font-size="42">限制</text><text x="590" y="735" font-size="42">取舍</text>
    <text x="590" y="505" font-size="56">设计判断</text>
  </g>
  <text x="70" y="80" fill="#77756f" font-family="monospace" font-size="22">DEVELOPMENT SAMPLE / 设计手记示例</text>
</svg>
